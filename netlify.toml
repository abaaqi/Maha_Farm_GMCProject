# Netlify config for the MahaFarm frontend (Vite SPA).
#
# Set these in Netlify → Site configuration → Environment variables:
#   VITE_ENABLE_MOCK_DATA = false
#   VITE_API_BASE_URL     = https://YOUR-API.onrender.com/api
#       (or "/api" if you enable the API proxy block below)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- Recommended: proxy /api to your backend so the browser stays same-origin
# (no CORS, first-party login cookies). To use it:
#   1) uncomment the block below
#   2) replace the URL with your Render API
#   3) set VITE_API_BASE_URL = /api  in the env vars
# It MUST come before the SPA fallback so it matches first.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA fallback — every other route serves index.html (client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
