[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# API proxy — MUST come before the SPA fallback
[[redirects]]
  from = "/api/*"
  to = "https://gmc-project-complete.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200